services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://refuel:${POSTGRES_PASSWORD}@db:5432/refuel
    ports: ["127.0.0.1:${PORT:-5999}:5999"]
    depends_on:
      db: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: refuel
      POSTGRES_USER: refuel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refuel -d refuel"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
